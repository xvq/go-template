app:
  name: go-template

server:
  host: 127.0.0.1
  port: 8080
  read_timeout: 15s
  write_timeout: 60s
  idle_timeout: 60s
  request_timeout: 30s
  shutdown_timeout: 15s
  body_limit: 4194304
  cors_origins: []
  trusted_proxies: []

log:
  level: info
  output: stdout # stdout / file / both
  dir: logs
  max_size_mb: 100
  max_backups: 7
  max_age_days: 14
  compress: true

database:
  host: 127.0.0.1
  port: 3306
  username: app
  password: ""
  database: go_template
  max_open_conns: 30
  max_idle_conns: 10
  conn_max_lifetime: 30m
  connect_timeout: 5s
  io_timeout: 30s
  slow_query: 500ms

redis:
  address: 127.0.0.1:6379
  username: ""
  password: ""
  db: 0
  prefix: go-template
  timeout: 3s

auth:
  admin:
    token_ttl: 24h
    allow_multiple_sessions: true
    login_limit: 10
    login_window: 1m

settings:
  cache_ttl: 1m

http_client:
  timeout: 30s
  connect_timeout: 5s
  max_idle_conns: 100
  max_idle_conns_per_host: 10
  idle_conn_timeout: 90s
  proxy: ""

schedule:
  timezone: Asia/Shanghai
  shutdown_timeout: 15s

queue:
  enabled: false
  concurrency: 10
  default_queue: default
  max_retry: 3
  task_timeout: 5m
  shutdown_timeout: 15s
  queues:
    default: 1
  # Empty address reuses redis connection settings. Asynq uses its own key names;
  # use a dedicated Redis DB/instance per project for queue isolation.
  redis:
    address: ""
    username: ""
    password: ""
    db: 1
